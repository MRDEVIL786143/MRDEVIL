kind = "web"
previewPath = "/"
title = "Social Media Video Downloader"
version = "1.0.0"
id = "artifacts/video-downloader"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21720
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/video-downloader run dev"

[services.env]
PORT = "21720"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/video-downloader", "run", "build"]
publicDir = "artifacts/video-downloader/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
